services:
  - type: web
    name: hermes-pinterest
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "5678"
      - key: PUBLIC_URL
        value: https://hermes-pinterest.onrender.com
      - key: PINTEREST_APP_ID
        sync: false
      - key: PINTEREST_APP_SECRET
        sync: false